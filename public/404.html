<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Day2DayCare</title>
    <script type="text/javascript">
      // Redirect 404s on GitHub Pages back to index.html with the route as a query string
      var pathSegmentsToKeep = 1; // 1 for project repositories (e.g. /Day2DayCare-Frontend/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
